name: taparide_flutter
description: Tap A Ride - Abuja Smart Mobility Platform (riders, operators, fleet owners and FCTA).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  flutter_map: ^8.2.1
  go_router: ^16.2.4
  latlong2: ^0.9.1
  provider: ^6.1.5
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.10.2
  url_launcher: ^6.3.1
  geolocator: ^14.1.1
  image_picker: ^1.2.4
  web: ^1.1.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/photos/
    - assets/onboarding/
    - assets/ads/
    - assets/events/
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
        - asset: assets/fonts/Barlow-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Barlow-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Barlow-ExtraBoldItalic.ttf
          weight: 800
          style: italic
    # Barlow has no Naira sign; Fira Sans supplies it as a fallback.
    - family: FiraSans
      fonts:
        - asset: assets/fonts/FiraSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/FiraSans-Bold.ttf
          weight: 700
