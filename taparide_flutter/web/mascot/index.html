<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tapi</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; cursor: pointer; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <!-- The host may serve this page as ".../mascot" (no trailing slash), so find mascot.js from the path. -->
  <script type="module">
    const dir = location.pathname.replace(/\/(index\.html)?$/, "").replace(/\/mascot$/, "") + "/mascot/";
    import(dir + "mascot.js");
  </script>
</body>
</html>
